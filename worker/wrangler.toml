name = "caldesk-sync"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 部署：Cloudflare Workers Builds 直接从 GitHub 拉本仓库，根目录设为 worker/，
# 构建命令 `npm ci`，部署命令 `npx wrangler deploy`。推代码即部署。
[[d1_databases]]
binding = "DB"
database_name = "caldesk"
database_id = "fbf5eb0b-3c5d-4726-85ba-511410db0d6f"

# 建表不需要手工执行 SQL：Worker 首次请求时会跑 src/schema.ts 里的
# CREATE TABLE IF NOT EXISTS（每个 isolate 一次）。

# 本地开发：worker/.dev.vars 里写 SYNC_TOKEN=xxx（该文件已被 .gitignore 排除）
# 线上：在 Cloudflare 控制台 Worker → 设置 → 变量和密钥 里加加密变量 SYNC_TOKEN
